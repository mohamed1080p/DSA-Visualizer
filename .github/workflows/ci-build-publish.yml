name: CI Build & Publish

on:
  push:
    branches: [ match_making ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/dsa-visualizer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v2

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-$(echo ${{ hashFiles('**/*.csproj') }})
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      - name: Publish app (for artifact)
        run: dotnet publish DSA-Visualizer/DSA-Visualizer.csproj -c Release -o ./artifacts/publish

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: DSA-Visualizer/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: ./artifacts/publish

  deploy:
    needs: build-and-publish
    runs-on: ubuntu-latest
    if: ${{ secrets.DEPLOY_HOST != '' }}
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to host via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: |
            set -e
            DEPLOY_PATH=${{ secrets.DEPLOY_PATH || '/opt/dsa-visualizer' }}
            echo "Deploying to $DEPLOY_PATH"
            if [ ! -d "$DEPLOY_PATH" ]; then
              git clone https://github.com/${{ github.repository }} "$DEPLOY_PATH"
            fi
            cd "$DEPLOY_PATH"
            git fetch --all
            git reset --hard $GITHUB_SHA
            # Ensure Docker and Compose are available on host
            docker compose -f docker-compose.server.yml pull || true
            docker compose -f docker-compose.server.yml up -d --build
